name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run TypeScript Typecheck
      run: bun run lint

    - name: Run Vitest Physics & API Tests
      run: bun run test

    - name: Build Production Bundle
      run: bun run build

    - name: Verify Production Distribution Artifacts
      run: |
        test -f dist/server.cjs || exit 1
        test -f dist/index.html || exit 1
        echo "All production artifacts validated successfully!"
